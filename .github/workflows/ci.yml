name: CI

# Uncomment push/pull_request when you want CI on GitHub. workflow_dispatch stays for manual runs.
on:
  workflow_dispatch:
# push:
#   branches: [main, master]
# pull_request:
#   branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Run prek
        run: uv run --frozen prek run --all-files

      - name: Integration tests
        # Add service containers, CLIs, and env here when you add integration tests.
        # Match what those tests need locally (minus optional pytest.skip paths).
        run: >-
          bash -c 'uv run pytest -m integration; c=$?; [ "$c" -eq 5 ] && exit 0; exit $c'
